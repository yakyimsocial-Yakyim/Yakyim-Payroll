<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAKYIM TMP — Employee Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#132A3A; --ink-2:#1c3a4f; --paper:#F5F2EA; --paper-2:#ffffff;
  --gold:#D9A441; --gold-dark:#B9832A; --green:#3F7A5C; --green-bg:#E7F1EA;
  --red:#B8452F; --red-bg:#FBEAE5; --line:#DCD5C4; --text:#232323; --muted:#6b6558;
  --radius:10px; --shadow: 0 2px 10px rgba(19,42,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ---- Auth screen ---- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(19,42,58,0.12);max-width:420px;width:100%;padding:32px 30px;}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.auth-brand .mark{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:20px;}
.auth-brand .name{font-family:'Fraunces',serif;font-weight:600;font-size:19px;}
.auth-brand .sub{font-size:12px;color:var(--muted);}
.auth-tabs{display:flex;gap:4px;background:var(--paper);border-radius:9px;padding:4px;margin-bottom:20px;}
.lang-switch{display:flex;gap:4px;margin-bottom:16px;background:var(--paper);border-radius:8px;padding:3px;}
.lang-btn{flex:1;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:6px 0;border-radius:6px;}
.lang-btn.active{background:var(--gold);color:var(--ink);}
.lang-btn:hover:not(.active){background:rgba(0,0,0,0.04);}
.auth-tab{flex:1;text-align:center;padding:9px 0;border:none;background:transparent;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted);}
.auth-tab.active{background:var(--ink);color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;}
.field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}
.pwd-wrap{position:relative;}
.pwd-wrap input{padding-right:42px;}
.pwd-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;width:30px;height:30px;border-radius:6px;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;}
.pwd-eye:hover{background:var(--paper);color:var(--ink);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);font-size:13.5px;font-weight:600;width:100%;}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.primary:hover{background:var(--ink-2);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);}
.btn.gold:hover{background:var(--gold-dark);}
.btn.sm{width:auto;padding:6px 12px;font-size:12px;}
.auth-error{background:var(--red-bg);color:var(--red);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;}
.auth-note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;text-align:center;}
.auth-foot-link{text-align:center;margin-top:16px;font-size:12px;}
.auth-foot-link a{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;}

/* ---- App shell (after login) ---- */
.app{max-width:760px;margin:0 auto;padding:26px 20px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.who{display:flex;align-items:center;gap:12px;}
.who .avatar{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;}
.who .nm{font-weight:700;font-size:15px;}
.who .ps{font-size:12px;color:var(--muted);}
.logout-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink);}
.logout-btn:hover{background:var(--paper);}

.section{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;}
.section-head{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;}
.section-body{padding:16px 18px;}

.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.month-card{border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;background:#fff;cursor:pointer;transition:all .12s;}
.month-card:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(217,164,65,0.18);}
.month-card .m{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
.month-card .net{font-size:11.5px;color:var(--muted);margin-top:4px;font-family:'IBM Plex Mono',monospace;}
.month-card.locked{opacity:.4;cursor:not-allowed;}
.month-card.locked:hover{border-color:var(--line);box-shadow:none;}

/* ---- Payslip (reused design) ---- */
.payslip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 26px;}
.payslip-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px;}
.payslip-top h2{margin:0;font-size:19px;}
.payslip-top .sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
.payslip-meta{text-align:right;font-size:12.5px;color:var(--muted);}
.payslip-meta b{color:var(--ink);font-size:14px;}
.payslip-emp{display:flex;justify-content:space-between;margin-bottom:18px;font-size:13px;flex-wrap:wrap;gap:10px;}
.payslip-emp div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
.payslip-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.payslip-cols h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.payslip-cols.income h4{color:var(--green);}
.payslip-cols.deduct h4{color:var(--red);}
.pl-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;gap:8px;}
.pl-row span:last-child{font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.pl-row.sum{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;}
.payslip-net{margin-top:20px;background:var(--ink);color:#fff;border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
.payslip-net .l{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#B8C4CC;}
.payslip-net .n{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--gold);}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px;cursor:pointer;}

.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13.5px;}
.profile-grid div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}

/* ---- Admin ---- */
.admin-badge{display:inline-block;background:var(--gold);color:var(--ink);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px;text-transform:uppercase;letter-spacing:.4px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:7px 6px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap;}
.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
.cell-input{width:70px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;}
.tbl-wrap{overflow-x:auto;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,0.25);opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:100;}
.toast.show{opacity:1;transform:translateY(0);}
.empty-state{padding:30px 18px;text-align:center;color:var(--muted);font-size:13px;}
.pending-badge{display:inline-block;background:var(--red-bg);color:var(--red);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
</style>
</head>

const SEED = JSON.parse(document.getElementById('app-data').textContent);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const AVAILABLE_FROM_INDEX = MONTHS.indexOf('Jul'); // Jul 2026 onward

const HAS_CLAUDE_STORAGE = typeof window.storage !== 'undefined' && typeof window.storage.get === 'function';

async function storageGet(key, shared, fallback){
  try{
    if(HAS_CLAUDE_STORAGE){
      const r = await window.storage.get(key, shared);
      return r ? JSON.parse(r.value) : fallback;
    } else {
      const raw = localStorage.getItem((shared?'yakyim-shared:':'yakyim-p:')+key);
      return raw!==null ? JSON.parse(raw) : fallback;
    }
  }catch(e){ return fallback; }
}
async function storageSet(key, shared, value){
  try{
    if(HAS_CLAUDE_STORAGE){
      await window.storage.set(key, JSON.stringify(value), shared);
    } else {
      localStorage.setItem((shared?'yakyim-shared:':'yakyim-p:')+key, JSON.stringify(value));
    }
  }catch(e){ console.error('storage set failed', key, e); }
}

/* ---------------- crypto helpers (SHA-256 + per-user salt) ---------------- */
function randomSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(password, salt){
  return sha256Hex(salt + ':' + password);
}

function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function pwdField(id, value){
  value = value || '';
  return `<div class="pwd-wrap">
    <input id="${id}" type="password" value="${value}" autocomplete="new-password">
    <button type="button" class="pwd-eye" data-toggle-for="${id}">👁</button>
  </div>`;
}
function bindPwdToggles(){
  document.querySelectorAll('.pwd-eye').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inp = document.getElementById(btn.dataset.toggleFor);
      if(!inp) return;
      inp.type = inp.type==='password' ? 'text' : 'password';
      btn.textContent = inp.type==='password' ? '👁' : '🙈';
    });
  });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=>t.classList.remove('show'), 2000);
}

function t(key, ...args){
  const v = I18N[state.lang][key];
  if(typeof v === 'function') return v(...args);
  return v!==undefined ? v : key;
}

/* ---------------- state ---------------- */
let state = {
  screen: 'loading',        // loading | auth | app | admin
  authTab: 'login',         // login | register
  authError: '',
  session: null,             // {username, empId} once logged in
  adminSession: false,
  employees: [],             // roster with ids
  accounts: [],              // [{username, salt, hash, empId, status}]
  payslips: {},               // {empId: {month: record}}
  adminAuth: null,            // {salt, hash} or null (not set up yet)
  currentView: 'months',      // months | payslip | profile
  currentMonth: null,
  adminMonth: 'Sep',
  sync: {url:'', secret:'', enabled:false},
  adminSetupDraft: null,
  lang: 'en',
};

function empById(id){ return state.employees.find(e=>e.id===id); }

async function loadAll(){
  let employees = await storageGet('employees', true, null);
  if(!employees){
    employees = SEED.roster.map((r,i)=>({
      id: 'E'+String(i+1).padStart(3,'0'),
      name: r.name, position: r.position,
      baseSalary: (SEED.Jul[r.name]||SEED.Aug[r.name]||{}).baseSalary || 0,
      allowance: (SEED.Jul[r.name]||SEED.Aug[r.name]||{}).allowance || 0,
      status: r.status, resignMonth: r.resignMonth, pin: ''
    }));
    await storageSet('employees', true, employees);
  }
  // migrate older saved records that don't have a pin field yet
  let employeesChanged = false;
  employees.forEach(e=>{ if(e.pin===undefined){ e.pin=''; employeesChanged=true; } });
  if(employeesChanged) await storageSet('employees', true, employees);
  state.employees = employees;

  let accounts = await storageGet('accounts', true, null);
  if(!accounts){ accounts = []; await storageSet('accounts', true, accounts); }
  // migrate older saved accounts that predate the approval flow: treat them as already approved
  let accountsChanged = false;
  accounts.forEach(a=>{ if(a.status===undefined){ a.status='approved'; accountsChanged=true; } });
  if(accountsChanged) await storageSet('accounts', true, accounts);
  state.accounts = accounts;

  let payslips = await storageGet('payslips', true, null);
  if(!payslips){
    payslips = {};
    employees.forEach(e=>{
      payslips[e.id] = {};
      ['Jul','Aug'].forEach(m=>{
        const rec = SEED[m][e.name];
        if(rec) payslips[e.id][m] = rec;
      });
    });
    await storageSet('payslips', true, payslips);
  }
  state.payslips = payslips;

  let adminAuth = await storageGet('adminAuth', true, null);
  state.adminAuth = adminAuth;

  const sync = await storageGet('syncConfig', true, null);
  if(sync) state.sync = {...state.sync, ...sync};

  // restore session from local (per-browser) storage — only if the account is still approved
  const savedSession = await storageGet('session', false, null);
  if(savedSession){
    const acc = state.accounts.find(a=>a.username===savedSession.username);
    if(acc && acc.status==='approved'){ state.session = {username: acc.username, empId: acc.empId}; }
    else { await storageSet('session', false, null); }
  }
}

/* ================= RENDER: SHELL ================= */
function render(){
  const root = document.getElementById('root');
  if(state.screen==='loading'){
    root.innerHTML = `<div class="auth-wrap"><div style="color:var(--muted);font-size:14px">Loading…</div></div>`;
    return;
  }
  if(state.screen==='auth'){
    root.innerHTML = renderAuthScreen();
    bindAuthEvents();
    return;
  }
  if(state.screen==='admin-setup'){
    root.innerHTML = renderAdminSetup();
    bindAdminSetupEvents();
    return;
  }
  if(state.screen==='admin-login'){
    root.innerHTML = renderAdminLogin();
    bindAdminLoginEvents();
    return;
  }
  if(state.screen==='admin-reset'){
    root.innerHTML = renderAdminReset();
    bindAdminResetEvents();
    return;
  }
  if(state.screen==='admin'){
    root.innerHTML = renderAdminApp();
    bindAdminAppEvents();
    return;
  }
  // logged-in employee app
  root.innerHTML = renderEmployeeApp();
  bindEmployeeAppEvents();
}

      </div>
      <div class="auth-tabs">
        <button class="auth-tab ${isLogin?'active':''}" data-tab="login">${t('login')}</button>
        <button class="auth-tab ${!isLogin?'active':''}" data-tab="register">${t('register')}</button>
      </div>
      ${state.authError ? `<div class="auth-error">${state.authError}</div>` : ''}
      ${isLogin ? `
        <div class="field"><label>${t('usernameLabel')}</label><input id="loginUsername" autocomplete="username"></div>
        <div class="field"><label>${t('passwordLabel')}</label>${pwdField('loginPassword')}</div>
        <button class="btn primary" id="loginBtn">${t('loginBtn')}</button>
        <div class="auth-note">${t('noAccount')} <a id="gotoRegister" style="cursor:pointer;text-decoration:underline;font-weight:600">${t('registerHere')}</a></div>
      ` : `
        <div class="field"><label>${t('selectYourName')}</label>
          <select id="regEmpId">
            <option value="">${t('selectNamePlaceholder')}</option>
            ${availableRoster.map(e=>`<option value="${e.id}">${e.name} (${e.position||''})</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>${t('pinLabel')}</label><input id="regPin" inputmode="numeric" placeholder="${t('pinPlaceholder')}"></div>
        <div class="field"><label>${t('setUsername')}</label><input id="regUsername" autocomplete="username"></div>
        <div class="field"><label>${t('setPassword')}</label>${pwdField('regPassword')}</div>
        <div class="field"><label>${t('confirmPassword')}</label>${pwdField('regPassword2')}</div>
        <button class="btn primary" id="registerBtn">${t('createAccount')}</button>
        <div class="auth-note">${t('registerNote')}</div>
      `}
      <div class="auth-foot-link"><a id="gotoAdmin">${t('adminLink')}</a></div>
    </div>
  </div>`;
}

function bindAuthEvents(){
  bindPwdToggles();
  document.querySelectorAll('.lang-btn').forEach(el=>{
    el.addEventListener('click', ()=>{ state.lang = el.dataset.lang; render(); });
  });
  document.querySelectorAll('.auth-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ state.authTab = el.dataset.tab; state.authError=''; render(); });
  });
  const gotoRegister = document.getElementById('gotoRegister');
  if(gotoRegister) gotoRegister.addEventListener('click', ()=>{ state.authTab='register'; state.authError=''; render(); });
  const gotoAdmin = document.getElementById('gotoAdmin');
  if(gotoAdmin) gotoAdmin.addEventListener('click', ()=>{
    state.screen = state.adminAuth ? 'admin-login' : 'admin-setup';
    render();
  });

  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.addEventListener('click', doLogin);
  const registerBtn = document.getElementById('registerBtn');
  if(registerBtn) registerBtn.addEventListener('click', doRegister);
}

async function doLogin(){
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!username || !password){ state.authError=t('pleaseEnterBoth'); render(); return; }
  const acc = state.accounts.find(a=>a.username.toLowerCase()===username.toLowerCase());
  if(!acc){ state.authError=t('accountNotFound'); render(); return; }
  const hash = await hashPassword(password, acc.salt);
  if(hash !== acc.hash){ state.authError=t('wrongPassword'); render(); return; }
  if(acc.status !== 'approved'){ state.authError=t('pendingLoginError'); render(); return; }
  state.session = {username: acc.username, empId: acc.empId};
  state.authError = '';
  await storageSet('session', false, state.session);
  state.screen = 'employee';
  state.currentView = 'months';
  render();
}

async function doRegister(){
  const empId = document.getElementById('regEmpId').value;
  const pin = document.getElementById('regPin').value.trim();
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const password2 = document.getElementById('regPassword2').value;
  if(!empId){ state.authError=t('pleaseSelectName'); render(); return; }
  const emp = empById(empId);
  if(!pin){ state.authError=t('pleaseEnterPin'); render(); return; }
  if(!emp.pin){ state.authError=t('pinNotSet'); render(); return; }
  if(pin !== emp.pin){ state.authError=t('pinIncorrect'); render(); return; }
  if(!username || username.length<3){ state.authError=t('usernameMinLen'); render(); return; }
  if(state.accounts.some(a=>a.username.toLowerCase()===username.toLowerCase())){
    state.authError=t('usernameTaken'); render(); return;
  }
  if(!password || password.length<4){ state.authError=t('passwordMinLen'); render(); return; }
  if(password !== password2){ state.authError=t('passwordMismatch'); render(); return; }

  const salt = randomSalt();
  const hash = await hashPassword(password, salt);
  state.accounts.push({username, salt, hash, empId, status:'pending'});
  await storageSet('accounts', true, state.accounts);

  // Do NOT log the employee in yet — account needs Admin approval first.
  state.authError = '';
  state.authTab = 'login';
  toast(t('registerPendingMsg'));
  render();
}

async function doLogout(){
  state.session = null;
  await storageSet('session', false, null);
  state.screen = 'auth';
  state.authTab = 'login';
  render();
}

/* ================= EMPLOYEE APP ================= */
function computeDisplayRecord(rec){
  // Historical (Jul/Aug) records are stored as final snapshots already; just return as-is with fallback fields.
  return {
    allowance: rec.allowance||0, baseSalary: rec.baseSalary||0,
    otHours: rec.otHours||0, otAmtHours: rec.otAmtHours||0,
    otDays: rec.otDays||0, otAmtDays: rec.otAmtDays||0,
    commission: rec.commission||0, totalIncome: rec.totalIncome||0,
    leaveDays: rec.leaveDays||0, leaveAmt: rec.leaveAmt||0,
    staffCardTimes: rec.staffCardTimes||0, scAmt: rec.scAmt||0,
    lateMinutes: rec.lateMinutes||0, lateAmt: rec.lateAmt||0,
    advance: rec.advance||0, visaFee: rec.visaFee||0, loan: rec.loan||0,
    epfSocso: rec.epfSocso||0, totalDeduct: rec.totalDeduct||0, netSalary: rec.netSalary||0,
  };
}

function renderEmployeeApp(){
  const emp = empById(state.session.empId);
  if(!emp){
    return `<div class="auth-wrap"><div class="auth-card">
      <p>${t('empNotFound')}</p>
      <button class="btn primary" id="logoutBtn2">${t('backToLogin')}</button>
    </div></div>`;
  }
  const initials = emp.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

  let body = '';
  if(state.currentView==='months') body = renderMonthsView(emp);
  else if(state.currentView==='payslip') body = renderPayslipView(emp);
  else if(state.currentView==='profile') body = renderProfileView(emp);

  return `
  <div class="app">
    <div class="topbar">
      <div class="who">
        <div class="avatar">${initials}</div>
        <div><div class="nm">${emp.name}</div><div class="ps">${emp.position||''} · Yakyim TMP</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="lang-switch" style="margin-bottom:0">
          <button class="lang-btn ${state.lang==='en'?'active':''}" data-lang="en">EN</button>
          <button class="lang-btn ${state.lang==='th'?'active':''}" data-lang="th">ไทย</button>
        </div>
        <button class="logout-btn" id="profileBtn">${t('profileBtn')}</button>
        <button class="logout-btn" id="logoutBtn">${t('logoutBtn')}</button>
      </div>
    </div>
    ${body}
  </div>`;
}

function renderMonthsView(emp){
  const recs = state.payslips[emp.id] || {};
  const cards = MONTHS.map((m, i)=>{
    const rec = recs[m];
    const isAvailable = i >= AVAILABLE_FROM_INDEX && rec;
    if(!isAvailable){
      return `<div class="month-card locked"><div class="m">${m}</div><div class="net">${t('noDataYet')}</div></div>`;
    }
    const c = computeDisplayRecord(rec);
    return `<div class="month-card" data-month="${m}"><div class="m">${m}</div><div class="net">RM ${fmtMoney(c.netSalary)}</div></div>`;
  }).join('');

  return `
  <div class="section">
    <div class="section-head">${t('myPayslips')}</div>
    <div class="section-body">
      <div class="month-grid">${cards}</div>
    </div>
  </div>`;
}

async function changePassword(){
  const oldPass = document.getElementById('oldPass').value;
  const newPass = document.getElementById('newPass').value;
  const acc = state.accounts.find(a=>a.username===state.session.username);
  if(!acc){ toast(t('accountNotFound2')); return; }
  const oldHash = await hashPassword(oldPass, acc.salt);
  if(oldHash !== acc.hash){ toast(t('incorrectOldPass')); return; }
  if(!newPass || newPass.length<4){ toast(t('passwordMinLen')); return; }
  acc.salt = randomSalt();
  acc.hash = await hashPassword(newPass, acc.salt);
  await storageSet('accounts', true, state.accounts);
  toast(t('passChanged'));
  document.getElementById('oldPass').value='';
  document.getElementById('newPass').value='';
}

function computeAdminRow(row){
  const otAmtHours = round2((row.otHours||0)*OT_RATE_HR);
  const otAmtDays = round2((row.otDays||0)*OT_RATE_DAY);
  const totalIncome = round2((row.allowance||0)+(row.baseSalary||0)+otAmtHours+otAmtDays+(row.commission||0));
  const leaveAmt = row.baseSalary>0 ? round2((row.leaveDays||0)*(row.baseSalary/26)) : 0;
  const scAmt = round2((row.staffCardTimes||0)*SC_RATE);
  const lateAmt = round2((row.lateMinutes||0)*LATE_RATE);
  const totalDeduct = round2(leaveAmt+scAmt+lateAmt+(row.advance||0)+(row.visaFee||0)+(row.loan||0)+(row.epfSocso||0));
  const netSalary = round2(totalIncome-totalDeduct);
  return {...row, otAmtHours, otAmtDays, totalIncome, leaveAmt, scAmt, lateAmt, totalDeduct, netSalary};
}

function empRowForSync(e){

}
function paySlipRowForSync(empId, month, rec){
  const emp = empById(empId);
  return {EmpID:empId, Month:month, Name:emp?emp.name:'', Position:emp?emp.position:'', ...rec};
}

async function pushAllToSheet(){
  if(!state.sync.url || !state.sync.secret){ toast(t('enterUrlSecret')); return; }
  try{
    await fetch(state.sync.url, {method:'POST', body: JSON.stringify({secret:state.sync.secret, action:'writeEmployees', rows: state.employees.map(empRowForSync)})});
    const payRows = [];
    Object.keys(state.payslips).forEach(empId=>{
      Object.keys(state.payslips[empId]).forEach(month=>{
        payRows.push(paySlipRowForSync(empId, month, state.payslips[empId][month]));
      });
    });
    await fetch(state.sync.url, {method:'POST', body: JSON.stringify({secret:state.sync.secret, action:'writePayslips', rows: payRows})});
    toast(t('pushSuccess'));
  }catch(e){ console.error(e); toast(t('pushFailed')); }
}

async function pullAllFromSheet(){
  if(!state.sync.url || !state.sync.secret){ toast(t('enterUrlSecret')); return; }
  try{
    const u1 = new URL(state.sync.url);
    u1.searchParams.set('secret', state.sync.secret);
    u1.searchParams.set('action', 'readPayslips');
    const resp = await fetch(u1.toString());
    const data = await resp.json();
    if(data.error){ toast(t('pullError', data.error)); return; }
    (data.rows||[]).forEach(r=>{
      if(!state.payslips[r.EmpID]) state.payslips[r.EmpID] = {};
      state.payslips[r.EmpID][r.Month] = {
        allowance:Number(r.Allowance)||0, baseSalary:Number(r.BaseSalary)||0,
        otHours:Number(r.OTHours)||0, otAmtHours:Number(r.OTAmtHours)||0,
        otDays:Number(r.OTDays)||0, otAmtDays:Number(r.OTAmtDays)||0,
        commission:Number(r.Commission)||0, totalIncome:Number(r.TotalIncome)||0,
        leaveDays:Number(r.LeaveDays)||0, leaveAmt:Number(r.LeaveAmt)||0,
        staffCardTimes:Number(r.StaffCardTimes)||0, scAmt:Number(r.SCAmt)||0,
        lateMinutes:Number(r.LateMinutes)||0, lateAmt:Number(r.LateAmt)||0,
        advance:Number(r.Advance)||0, visaFee:Number(r.VisaFee)||0, loan:Number(r.Loan)||0,
        epfSocso:Number(r.EPFSocso)||0, totalDeduct:Number(r.TotalDeduct)||0, netSalary:Number(r.NetSalary)||0,
      };
    });
    await storageSet('payslips', true, state.payslips);
    toast(t('pullSuccess'));
    render();
  }catch(e){ console.error(e); toast(t('pullFailed')); }
}

async function onAdminCellChange(ev){
  const el = ev.target;
  const empId = el.dataset.emp, field = el.dataset.field;
  const month = state.adminMonth;
  const emp = empById(empId);
  if(!state.payslips[empId]) state.payslips[empId] = {};
  if(!state.payslips[empId][month]){
    // initialize with sensible defaults (base salary/allowance from employee record) before applying the edit
    state.payslips[empId][month] = {
      allowance: emp.allowance||0, baseSalary: emp.baseSalary||0,
      otHours:0, otDays:0, commission:0, leaveDays:0, staffCardTimes:0, lateMinutes:0,
      advance:0, visaFee:0, loan:0, epfSocso:0
    };
  }
  state.payslips[empId][month][field] = parseFloat(el.value)||0;
  // recompute derived fields and store full snapshot
  const full = computeAdminRow(state.payslips[empId][month]);
  state.payslips[empId][month] = full;
  await storageSet('payslips', true, state.payslips);
  render();
  toast(t('saved'));
  if(state.sync.enabled && state.sync.url && state.sync.secret){
    fetch(state.sync.url, {method:'POST', body: JSON.stringify({secret:state.sync.secret, action:'writePayslips', rows:[paySlipRowForSync(empId, month, full)]})}).catch(e=>console.error(e));
  }
}

/* ================= BOOT ================= */
(async function boot(){
  await loadAll();
  state.screen = state.session ? 'employee' : 'auth';
  render();
})();

</script>
