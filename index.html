<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAKYIM PAYROLL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#132A3A;
  --ink-2:#1c3a4f;
  --paper:#F5F2EA;
  --paper-2:#ffffff;
  --gold:#D9A441;
  --gold-dark:#B9832A;
  --green:#3F7A5C;
  --green-bg:#E7F1EA;
  --red:#B8452F;
  --red-bg:#FBEAE5;
  --line:#DCD5C4;
  --text:#232323;
  --muted:#6b6558;
  --radius:10px;
  --shadow: 0 2px 10px rgba(19,42,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:236px;flex:0 0 236px;
  background:var(--ink);
  color:#EDEBE3;
  display:flex;flex-direction:column;
  padding:22px 16px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:0 4px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:17px;
  flex:0 0 auto;
}
.brand-text{line-height:1.15;}
.brand-text .t1{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;letter-spacing:.2px;}
.brand-text .t2{font-size:10.5px;color:#A9B7C1;letter-spacing:1.4px;text-transform:uppercase;}
.sidebar-sub{font-size:11px;color:#8FA0AC;margin:14px 4px 8px;text-transform:uppercase;letter-spacing:1.1px;}
.lang-switch{display:flex;gap:4px;margin:4px 4px 2px;background:rgba(255,255,255,0.06);border-radius:8px;padding:3px;}
.lang-btn{flex:1;border:none;background:transparent;color:#A9B7C1;font-size:12px;font-weight:600;padding:6px 0;border-radius:6px;}
.lang-btn.active{background:var(--gold);color:var(--ink);}
.lang-btn:hover:not(.active){background:rgba(255,255,255,0.08);color:#fff;}

.branch-picker{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.branch-chip{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 10px;border-radius:8px;border:1px solid transparent;
  color:#D7DEE3;font-size:13.5px;font-weight:500;
  background:transparent;text-align:left;
}
.branch-chip:hover{background:rgba(255,255,255,0.06);}
.branch-chip.active{background:rgba(217,164,65,0.16);border-color:rgba(217,164,65,0.5);color:#fff;}
.branch-chip .dot{width:7px;height:7px;border-radius:50%;background:#5C7080;flex:0 0 auto;}
.branch-chip.active .dot{background:var(--gold);}
.branch-chip .cnt{font-size:11px;color:#8FA0AC;font-family:'IBM Plex Mono',monospace;}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.nav-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:8px;border:none;background:transparent;
  color:#C7D0D6;font-size:14px;font-weight:500;text-align:left;width:100%;
}
.nav-btn:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-btn.active{background:#fff;color:var(--ink);}
.nav-btn .ic{width:18px;text-align:center;flex:0 0 auto;font-size:15px;}

.sidebar-foot{margin-top:auto;padding:10px 4px 0;font-size:11px;color:#748792;border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;}

/* ---------- Main ---------- */
main{flex:1;min-width:0;padding:26px 34px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
.view-title{font-size:24px;font-weight:600;letter-spacing:-.2px;}
.view-sub{color:var(--muted);font-size:13.5px;margin-top:2px;}

.month-picker{display:flex;align-items:center;gap:6px;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:5px 6px;box-shadow:var(--shadow);}
.month-picker button{border:none;background:transparent;width:26px;height:26px;border-radius:6px;color:var(--ink);font-size:14px;}
.month-picker button:hover{background:var(--paper);}
.month-picker select{border:none;background:transparent;font-weight:600;font-size:14px;color:var(--ink);padding:2px 4px;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px;}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.card .k{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;}
.card .v{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin-top:6px;color:var(--ink);}
.card .v.pos{color:var(--green);}
.card .v.neg{color:var(--red);}
.card .foot{font-size:12px;color:var(--muted);margin-top:4px;}

.section{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
.section-head h3{margin:0;font-size:15.5px;font-weight:600;}
.section-body{padding:16px 18px;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper-2);color:var(--ink);font-size:13px;font-weight:600;
  transition:background .12s;
}
.btn:hover{background:var(--paper);}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.primary:hover{background:var(--ink-2);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);}
.btn.gold:hover{background:var(--gold-dark);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn.danger{color:var(--red);border-color:#E7C9C0;}
.btn.danger:hover{background:var(--red-bg);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:2px solid var(--line);
  white-space:nowrap;position:sticky;top:0;background:var(--paper-2);
}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr.total-row td{font-weight:700;background:var(--paper);border-top:2px solid var(--ink);}
.tbl-wrap{overflow-x:auto;}
.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
.cell-input{
  width:78px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;
  text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:#fff;
}
.cell-input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.cell-input.readonly{background:var(--paper);color:var(--muted);border-color:transparent;}
.name-cell{font-weight:600;color:var(--ink);}
.pos-cell{color:var(--muted);font-size:12px;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.tag.ok{background:var(--green-bg);color:var(--green);}
.tag.warn{background:#FCF2DC;color:var(--gold-dark);}
.tag.bad{background:var(--red-bg);color:var(--red);}
.tag.muted{background:var(--paper);color:var(--muted);}

.branch-pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px;}
.branch-pill.Lite{background:#E4EEF3;color:#2A5E77;}
.branch-pill.TMP{background:#EFE7F5;color:#6A4C93;}
.branch-pill.YYKJ{background:#F5EBDD;color:#8A5A20;}

.alert-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.alert-row:last-child{border-bottom:none;}
.alert-row .ic{font-size:16px;flex:0 0 auto;}
.alert-row .txt{font-size:13px;}
.alert-row .txt b{color:var(--ink);}
.alert-row .txt span{color:var(--muted);font-size:12px;}
.empty-state{padding:34px 18px;text-align:center;color:var(--muted);font-size:13.5px;}
.empty-state .big{font-size:30px;margin-bottom:8px;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(19,42,58,0.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow:auto;}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:17px;}
.modal-close{border:none;background:var(--paper);width:28px;height:28px;border-radius:50%;font-size:15px;color:var(--muted);}
.modal-body{padding:20px 22px;max-height:70vh;overflow:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid.full{grid-template-columns:1fr;}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
.field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;}
.field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}

/* payslip */
.payslip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px 34px;max-width:640px;margin:0 auto;}
.payslip-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px;}
.payslip-top h2{margin:0;font-size:20px;}
.payslip-top .sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
.payslip-meta{text-align:right;font-size:12.5px;color:var(--muted);}
.payslip-meta b{color:var(--ink);font-size:14px;}
.payslip-emp{display:flex;justify-content:space-between;margin-bottom:18px;font-size:13px;}
.payslip-emp div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
.payslip-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.payslip-cols h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.payslip-cols.income h4{color:var(--green);}
.payslip-cols.deduct h4{color:var(--red);}
.pl-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;}
.pl-row span:last-child{font-family:'IBM Plex Mono',monospace;}
.pl-row.sum{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;}
.payslip-net{margin-top:20px;background:var(--ink);color:#fff;border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
.payslip-net .l{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#B8C4CC;}
.payslip-net .n{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--gold);}
.payslip-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px;}
.payslip-sign .line{border-top:1px solid var(--muted);margin-top:34px;padding-top:6px;font-size:11.5px;color:var(--muted);text-align:center;}

@media print{
  .sidebar,.topbar,.no-print{display:none !important;}
  main{padding:0;}
  body{background:#fff;}
  .payslip{border:none;max-width:100%;}
}

.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,0.25);opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:100;}
.toast.show{opacity:1;transform:translateY(0);}

select.branch-select-inline{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;font-weight:600;background:#fff;}

.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.rate-field{margin-bottom:10px;}
.rate-field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.rate-field input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-family:'IBM Plex Mono',monospace;}

.search-box{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;}
.search-box input{border:none;outline:none;font-size:13px;width:180px;}

.adv-link{border:none;background:none;color:var(--ink);text-decoration:underline;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:0;cursor:pointer;}
.adv-link:hover{color:var(--gold-dark);}
.adv-table{width:100%;border-collapse:collapse;margin-top:4px;}
.adv-table th{font-size:10.5px;position:static;background:none;border-bottom:1px solid var(--line);}
.adv-table td{padding:8px 6px;}
.adv-table input[type=date]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;}
.adv-table input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Mono',monospace;text-align:right;font-size:12.5px;}
.adv-total-row{font-weight:700;border-top:2px solid var(--ink);}
</style>
</head>

/* ---------------- Sunday-of-month helper ---------------- */
const MONTH_INDEX = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function getSundays(monthAbbr, year=2026){
  const mi = MONTH_INDEX[monthAbbr];
  const sundays = [];
  const d = new Date(year, mi, 1);
  while(d.getMonth()===mi){
    if(d.getDay()===0){
      const iso = d.toISOString().slice(0,10);
      sundays.push(iso);
    }
    d.setDate(d.getDate()+1);
  }
  return sundays;
}
function makeAdvanceWeeks(month, seedAmounts){
  const sundays = getSundays(month);
  const weeks = sundays.map((date,i)=>({date, amount: (seedAmounts && seedAmounts[i]) || 0}));
  // fold any seed amounts beyond the number of real Sundays into the last week (preserves original totals)
  if(seedAmounts && seedAmounts.length > sundays.length && weeks.length){
    let overflow = 0;
    for(let i=sundays.length;i<seedAmounts.length;i++) overflow += seedAmounts[i]||0;
    weeks[weeks.length-1].amount = round2(weeks[weeks.length-1].amount + overflow);
  }
  return weeks;
}
function advanceTotal(row){
  if(Array.isArray(row.advanceWeeks)) return round2(row.advanceWeeks.reduce((s,w)=>s+(Number(w.amount)||0),0));
  return row.advance || 0;
}

/* ---------------- storage helpers (works both inside Claude artifacts AND standalone, e.g. GitHub Pages) ---------------- */
const HAS_CLAUDE_STORAGE = typeof window.storage !== 'undefined' && typeof window.storage.get === 'function';

async function storageGet(key, fallback){
  try{
    if(HAS_CLAUDE_STORAGE){
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : fallback;
    } else {
      const raw = localStorage.getItem('yakyim:'+key);
      return raw!==null ? JSON.parse(raw) : fallback;
    }
  }catch(e){ return fallback; }
}
async function storageSet(key, value){
  try{
    if(HAS_CLAUDE_STORAGE){
      await window.storage.set(key, JSON.stringify(value), false);
    } else {
      localStorage.setItem('yakyim:'+key, JSON.stringify(value));
    }
  }catch(e){ console.error('storage set failed', key, e); }
}

function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.round((d - TODAY)/86400000);
}

/* ---------------- init / seed ---------------- */
async function loadState(){
  let employees = await storageGet('employees', null);
  let rates = await storageGet('rates', null);
  if(!employees){
    employees = SEED.employees.map(e=>({...e}));
    await storageSet('employees', employees);
  }
  if(!rates){
    rates = SEED.rates;
    await storageSet('rates', rates);
  }
  state.employees = employees;
  state.rates = rates;

  // seed payroll for the baseline month per branch if not present
  for(const b of ['Lite','TMP','YYKJ']){
    const m = SEED.seedMonth[b];
    const key = `payroll:${b}:${m}`;
    let existing = await storageGet(key, null);
    if(!existing){
      const rows = SEED.seedRows[b];
      const map = {};
      employees.filter(e=>e.branch===b).forEach(emp=>{
        const seedRow = rows.find(r => normName(r.name) === normName(emp.name));
        const advSeedAmounts = (SEED.advSeed[b]||{})[normName(emp.name)];
        map[emp.id] = seedRow ? {
          allowance: seedRow.allowance||0,
          baseSalary: seedRow.baseSalary||0,
          otHours: seedRow.otHours||0,
          otDays: seedRow.otDays||0,
          commission: seedRow.commission||0,
          leaveDays: seedRow.leaveDays||0,
          staffCardTimes: seedRow.staffCardTimes||0,
          lateMinutes: seedRow.lateMinutes||0,
          advanceWeeks: makeAdvanceWeeks(m, advSeedAmounts),
          visaFee: seedRow.visaFee||0,
          loan: seedRow.loan||0,
          epfSocso: seedRow.epfSocso||0,
        } : {...EMPTY_ROW, baseSalary: emp.baseSalary||0, allowance: emp.allowance||0, advanceWeeks: makeAdvanceWeeks(m, advSeedAmounts)};
      });
      await storageSet(key, map);
      existing = map;
    }
    state.payroll[key] = existing;
  }
  state.month = SEED.seedMonth.TMP;

  const sync = await storageGet('syncConfig', null);
  if(sync) state.sync = {...state.sync, ...sync};
}

function normName(n){
  return (n||'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim().toLowerCase();
}

async function getPayrollMap(branch, month){
  const key = `payroll:${branch}:${month}`;
  if(state.payroll[key]) return state.payroll[key];
  let map = await storageGet(key, null);
  if(!map){
    map = {};
    state.employees.filter(e=>e.branch===branch).forEach(emp=>{
      map[emp.id] = {...EMPTY_ROW, baseSalary: emp.baseSalary||0, allowance: emp.allowance||0, advanceWeeks: makeAdvanceWeeks(month)};
    });
    await storageSet(key, map);
  }
  state.payroll[key] = map;
  return map;
}

function computeRow(row, rates){
  const otAmtHours = round2((row.otHours||0) * rates.otRateHr);
  const otAmtDays = round2((row.otDays||0) * rates.otRateDay);
  const totalIncome = round2((row.allowance||0) + (row.baseSalary||0) + otAmtHours + otAmtDays + (row.commission||0));
  const leaveAmt = row.baseSalary>0 ? round2((row.leaveDays||0) * (row.baseSalary/26)) : 0;
  const scAmt = round2((row.staffCardTimes||0) * rates.scRate);
  const lateAmt = round2((row.lateMinutes||0) * rates.lateRate);
  const advance = advanceTotal(row);
  const totalDeduct = round2(leaveAmt + scAmt + lateAmt + advance + (row.visaFee||0) + (row.loan||0) + (row.epfSocso||0));
  const netSalary = round2(totalIncome - totalDeduct);
  return {otAmtHours,otAmtDays,totalIncome,leaveAmt,scAmt,lateAmt,advance,totalDeduct,netSalary};
}

/* ---------------- derived helpers ---------------- */
function branchList(){ return ['Lite','TMP','YYKJ']; }
function currentEmployees(){
  if(state.branch==='All') return state.employees;
  return state.employees.filter(e=>e.branch===state.branch);
}
function isResigned(status){
  const s = (status||'').toLowerCase();
  return s.includes('ลาออก') || s.includes('resign');
}

function visaAlertLevel(days){
  if(days===null) return null;
  if(days<0) return 'bad';
  if(days<=60) return 'warn';
  return null;
}

function buildAlerts(){
  const alerts = [];
  state.employees.forEach(emp=>{
    const p = emp.profile;
    if(!p) return;
    const vd = daysUntil(p.visaExpiry);
    const pd = daysUntil(p.passportExpiry);
    const lvl = visaAlertLevel(vd);
    if(lvl){
      alerts.push({emp, type:'visa', days:vd, level:lvl});
    }
    const plvl = visaAlertLevel(pd);
    if(plvl){
      alerts.push({emp, type:'passport', days:pd, level:plvl});
    }
  });
  alerts.sort((a,b)=> (a.days??999) - (b.days??999));
  return alerts;
}

function renderDashboard(){

/* ================= GOOGLE SHEETS REAL-TIME SYNC ================= */
let syncPollTimer = null;

function rowsForSyncPush(branch, month){
  const map = state.payroll[`payroll:${branch}:${month}`] || {};
  const rates = state.rates[branch];
  const emps = state.employees.filter(e=>e.branch===branch);
  return emps.map(e=>{
    const row = map[e.id] || {...EMPTY_ROW};
    const c = computeRow(row, rates);
    return {
      EmpID: e.id, Month: month, Name: e.name, Position: e.position||'',
      Allowance: row.allowance||0, BaseSalary: row.baseSalary||0,
      OTHours: row.otHours||0, OTDays: row.otDays||0, Commission: row.commission||0,
      LeaveDays: row.leaveDays||0, StaffCardTimes: row.staffCardTimes||0, LateMinutes: row.lateMinutes||0,
      Advance: c.advance, VisaFee: row.visaFee||0, Loan: row.loan||0, EPFSocso: row.epfSocso||0
    };
  });
}

async function syncPushBranch(branch, month){
  if(!state.sync.enabled || !state.sync.url || !state.sync.secret) return;
  try{
    const rows = rowsForSyncPush(branch, month);
    await fetch(state.sync.url, {
      method:'POST',
      body: JSON.stringify({secret:state.sync.secret, branch, action:'writeAll', month, rows})
    });
    state.sync.status = 'ok';
  }catch(e){
    console.error('sync push failed', e);
    state.sync.status = 'error';
  }
}

async function syncPullBranch(branch, month){
  if(!state.sync.enabled || !state.sync.url || !state.sync.secret) return;
  try{
    const u = new URL(state.sync.url);
    u.searchParams.set('secret', state.sync.secret);
    u.searchParams.set('branch', branch);
    u.searchParams.set('action', 'readAll');
    u.searchParams.set('month', month);
    const resp = await fetch(u.toString());
    const data = await resp.json();
    if(data.error){ console.error('sync pull error', data.error); state.sync.status='error'; return; }
    const key = `payroll:${branch}:${month}`;
    const map = state.payroll[key] || {};
    (data.rows||[]).forEach(r=>{
      if(!map[r.EmpID]) map[r.EmpID] = {...EMPTY_ROW};
      Object.assign(map[r.EmpID], {
        allowance: Number(r.Allowance)||0, baseSalary: Number(r.BaseSalary)||0,
        otHours: Number(r.OTHours)||0, otDays: Number(r.OTDays)||0, commission: Number(r.Commission)||0,
        leaveDays: Number(r.LeaveDays)||0, staffCardTimes: Number(r.StaffCardTimes)||0, lateMinutes: Number(r.LateMinutes)||0,
        visaFee: Number(r.VisaFee)||0, loan: Number(r.Loan)||0, epfSocso: Number(r.EPFSocso)||0,
      });
      // if the sheet's Advance total differs from our weekly breakdown sum, adjust the last week to match
      const sheetAdv = Number(r.Advance)||0;
      const curAdv = advanceTotal(map[r.EmpID]);
      if(Array.isArray(map[r.EmpID].advanceWeeks) && Math.abs(sheetAdv-curAdv)>0.001 && map[r.EmpID].advanceWeeks.length){
        const diff = round2(sheetAdv - curAdv);
        const last = map[r.EmpID].advanceWeeks[map[r.EmpID].advanceWeeks.length-1];
        last.amount = round2((last.amount||0) + diff);
      }
    });
    state.payroll[key] = map;
    await storageSet(key, map);
    state.sync.status = 'ok';
  }catch(e){
    console.error('sync pull failed', e);
    state.sync.status = 'error';
  }
}

async function syncPushAll(){
  for(const b of branchList()){ await syncPushBranch(b, state.month); }
}
async function syncPullAll(){
  for(const b of branchList()){ await syncPullBranch(b, state.month); }
  render();
}

function startSyncPolling(){
  stopSyncPolling();
  if(!state.sync.enabled) return;
  syncPollTimer = setInterval(()=>{ syncPullAll(); }, 15000);
}
function stopSyncPolling(){
  if(syncPollTimer){ clearInterval(syncPollTimer); syncPollTimer = null; }
}

async function saveSyncConfig(){
  const url = document.getElementById('syncUrl').value.trim();
  const secret = document.getElementById('syncSecret').value.trim();
  const enabled = document.getElementById('syncEnabled').checked;
  state.sync = {...state.sync, url, secret, enabled};
  await storageSet('syncConfig', state.sync);
  if(enabled){ startSyncPolling(); await syncPushAll(); toast(t('syncSaved')); }
  else { stopSyncPolling(); toast(t('syncDisabled')); }
  render();
}

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[data-src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.dataset.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Failed to load '+src));
    document.head.appendChild(s);
  });
}

      isResigned(e.status) ? `Resigned${e.resignMonth?' ('+e.resignMonth+')':''}` : 'Active',
      p.nickname||'', p.passportNo||'', p.passportExpiry||'', p.visaExpiry||'', p.startDate||'',
      [p.bankName,p.bankAccount].filter(Boolean).join(' / ')
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(staffRows), 'Staff');

  const header = ['Employee','Position','Allowance','Base Salary','OT (hrs)','OT Amt','OT (days)','OT Amt','Commission',
    'Total Income','Leave (days)','Leave Amt','Staff Card','SC Amt','Late (min)','Late Amt','Advance','Visa Fee','Loan',
    'EPF+Socso','Total Deduct','NET'];

  branchList().forEach(b=>{
    const map = state.payroll[`payroll:${b}:${month}`] || {};
    const rates = state.rates[b];
    const emps = state.employees.filter(e=>e.branch===b);
    const rows = [[`${BRANCH_LABEL[b]} — Payroll ${month} 2026`],[],header];
    emps.forEach(e=>{
      const row = map[e.id] || {...EMPTY_ROW};
      const c = computeRow(row, rates);
      rows.push([
        e.name, e.position||'', row.allowance||0, row.baseSalary||0,
        row.otHours||0, c.otAmtHours, row.otDays||0, c.otAmtDays, row.commission||0,
        c.totalIncome, row.leaveDays||0, c.leaveAmt, row.staffCardTimes||0, c.scAmt,
        row.lateMinutes||0, c.lateAmt, c.advance, row.visaFee||0, row.loan||0,
        row.epfSocso||0, c.totalDeduct, c.netSalary
      ]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), b);
  });

  return XLSX.write(wb, {type:'base64', bookType:'xlsx'});
}

async function exportToDrive(){
  const btn = document.getElementById('exportDriveBtn');
  if(btn){ btn.disabled = true; btn.textContent = t('preparingFile'); }
  try{
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const base64 = buildWorkbookBase64(state.month);
    const filename = `Yakyim Payroll - ${state.month} 2026`;
    if(btn) btn.textContent = t('uploadingToDrive');
    toast(t('uploadingToDrive'));

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1024,
        messages: [{
          role: 'user',
          content: `Call the Google Drive create_file tool right now with exactly these parameters — do not ask for confirmation, do not explain, just call it:
title: "${filename}"
contentMimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
disableConversionToGoogleType: false
base64Content: (given below)

base64Content:
${base64}`
        }],
        mcp_servers: [{type:'url', url:'https://drivemcp.googleapis.com/mcp/v1', name:'google-drive'}]
      })
    });
    const data = await resp.json();
    const content = data.content || [];
    const toolResult = content.find(b=>b.type==='mcp_tool_result');
    const isError = toolResult && (toolResult.is_error || (toolResult.content||[]).some(c=>/error/i.test(c.text||'')));
    if(toolResult && !isError){
      toast(t('exportedSuccess'));
    } else {
      console.error('Drive export response', data);
      toast(t('exportFailed'));
    }
  }catch(e){
    console.error(e);
    toast(t('exportFailed'));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = t('exportToDrive'); }
  }
}

/* ================= EVENT BINDING ================= */
function bindGlobalEvents(){
  document.querySelectorAll('.lang-btn').forEach(el=>{
    el.addEventListener('click', ()=>{ state.lang = el.dataset.lang; render(); });
  });
  document.querySelectorAll('.branch-chip').forEach(el=>{
    el.addEventListener('click', ()=>{ state.branch = el.dataset.branch; render(); });
  });
  document.querySelectorAll('.nav-btn').forEach(el=>{
    el.addEventListener('click', ()=>{ state.view = el.dataset.view; render(); });
  });

  const monthSel = document.getElementById('monthSelect');
  if(monthSel){
    monthSel.addEventListener('change', async ()=>{
      state.month = monthSel.value;
      await ensureMonthLoaded();
      render();
    });
  }
  const prevM = document.getElementById('prevMonth');
  const nextM = document.getElementById('nextMonth');
  const exportBtn = document.getElementById('exportDriveBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportToDrive);
  if(prevM) prevM.addEventListener('click', async ()=>{
    let i = MONTHS.indexOf(state.month);
    i = (i-1+12)%12; state.month = MONTHS[i];
    await ensureMonthLoaded(); render();
  });
  if(nextM) nextM.addEventListener('click', async ()=>{
    let i = MONTHS.indexOf(state.month);
    i = (i+1)%12; state.month = MONTHS[i];
    await ensureMonthLoaded(); render();
  });

  /* ---- Staff view ---- */
  const searchBox = document.getElementById('staffSearch');
  if(searchBox){
    searchBox.addEventListener('input', ()=>{ state.staffSearch = searchBox.value; renderStaffOnly(); });
  }
  document.querySelectorAll('.staff-row').forEach(row=>{
    row.addEventListener('click', (ev)=>{
      if(ev.target.closest('button')) return;
      state.editingEmp = row.dataset.emp; render();
    });
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{ ev.stopPropagation(); state.editingEmp = btn.dataset.edit; render(); });
  });
  const addBtn = document.getElementById('addEmpBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{ state.editingEmp='new'; render(); });

  const empClose = document.getElementById('empModalClose');
  const empCancel = document.getElementById('empCancel');
  const empBg = document.getElementById('empModalBg');
  [empClose, empCancel].forEach(el=> el && el.addEventListener('click', ()=>{ state.editingEmp=null; render(); }));
  if(empBg) empBg.addEventListener('click', (ev)=>{ if(ev.target===empBg){ state.editingEmp=null; render(); } });

  const empSave = document.getElementById('empSave');
  if(empSave) empSave.addEventListener('click', saveEmployee);
  const empDelete = document.getElementById('empDelete');
  if(empDelete) empDelete.addEventListener('click', deleteEmployee);

  /* ---- Payroll grid ---- */
  document.querySelectorAll('.cell-input').forEach(inp=>{
    inp.addEventListener('change', onPayrollCellChange);
  });
  document.querySelectorAll('[data-adv-branch]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.advanceModal = {branch: btn.dataset.advBranch, empId: btn.dataset.advEmp};
      render();
    });
  });
  const advClose = document.getElementById('advModalClose');
  const advCancel = document.getElementById('advCancel');
  const advBg = document.getElementById('advModalBg');
  [advClose, advCancel].forEach(el=> el && el.addEventListener('click', ()=>{ state.advanceModal=null; render(); }));
  if(advBg) advBg.addEventListener('click', (ev)=>{ if(ev.target===advBg){ state.advanceModal=null; render(); } });
  const advSave = document.getElementById('advSave');
  if(advSave) advSave.addEventListener('click', saveAdvanceWeeks);
  document.querySelectorAll('#advRows input').forEach(inp=>{
    inp.addEventListener('input', onAdvanceRowInput);
  });

  /* ---- Payslip ---- */
  const slipSel = document.getElementById('payslipEmpSelect');
  if(slipSel) slipSel.addEventListener('change', ()=>{ state.payslipEmpId = slipSel.value; render(); });
  const printBtn = document.getElementById('printSlip');
  if(printBtn) printBtn.addEventListener('click', ()=> window.print());

  /* ---- Settings ---- */
  document.querySelectorAll('[data-rate-branch]').forEach(inp=>{
    inp.addEventListener('change', onRateChange);
  });
  const saveSyncBtn = document.getElementById('saveSyncBtn');
  if(saveSyncBtn) saveSyncBtn.addEventListener('click', saveSyncConfig);
  const pullNowBtn = document.getElementById('pullNowBtn');
  if(pullNowBtn) pullNowBtn.addEventListener('click', ()=>{ toast(t('syncPullNow')); syncPullAll(); });
}

function renderStaffOnly(){
  const root = document.getElementById('root');
  const main = root.querySelector('main');
  main.innerHTML = renderTopbar() + renderView();
  bindGlobalEvents();
  document.getElementById('staffSearch').focus();
  document.getElementById('staffSearch').setSelectionRange(999,999);
}

async function ensureMonthLoaded(){
  for(const b of branchList()){
    await getPayrollMap(b, state.month);
  }
}

async function onPayrollCellChange(ev){
  const el = ev.target;
  const branch = el.dataset.branch, empId = el.dataset.emp, field = el.dataset.field;
  const key = `payroll:${branch}:${state.month}`;
  const map = state.payroll[key];
  if(!map[empId]) map[empId] = {...EMPTY_ROW};
  map[empId][field] = parseFloat(el.value)||0;
  await storageSet(key, map);
  render();
  toast(t('saved'));
  syncPushBranch(branch, state.month);
}

function onAdvanceRowInput(){
  // live-update the total shown in the modal without saving yet
  let total = 0;
  document.querySelectorAll('#advRows tr').forEach(tr=>{
    const amtInput = tr.querySelector('input[data-field="amount"]');
    total += parseFloat(amtInput.value)||0;
  });
  const cell = document.getElementById('advTotalCell');
  if(cell) cell.textContent = fmtMoney(total);
}

async function saveAdvanceWeeks(){
  const {branch, empId} = state.advanceModal;
  const key = `payroll:${branch}:${state.month}`;
  const map = state.payroll[key];
  if(!map[empId]) map[empId] = {...EMPTY_ROW};
  const weeks = [];
  document.querySelectorAll('#advRows tr').forEach((tr,i)=>{
    const dateInput = tr.querySelector('input[data-field="date"]');
    const amtInput = tr.querySelector('input[data-field="amount"]');
    weeks.push({date: dateInput.value, amount: parseFloat(amtInput.value)||0});
  });
  map[empId].advanceWeeks = weeks;
  await storageSet(key, map);
  state.advanceModal = null;
  render();
  toast(t('advanceSaved'));
  syncPushBranch(branch, state.month);
}

async function onRateChange(ev){
  const el = ev.target;
  const b = el.dataset.rateBranch, f = el.dataset.rateField;
  state.rates[b][f] = parseFloat(el.value)||0;
  await storageSet('rates', state.rates);
  render();
  toast(t('rateSaved'));
}

async function saveEmployee(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast(t('pleaseEnterName')); return; }
  const branch = document.getElementById('f_branch').value;
  const position = document.getElementById('f_position').value.trim();
  const baseSalary = parseFloat(document.getElementById('f_base').value)||0;
  const allowance = parseFloat(document.getElementById('f_allow').value)||0;
  const status = document.getElementById('f_status').value;
  const resignMonth = document.getElementById('f_resign').value.trim();
  const bankRaw = document.getElementById('p_bank').value.trim();
  let [bankName, bankAccount] = bankRaw.includes('/') ? bankRaw.split('/').map(s=>s.trim()) : [bankRaw, ''];

  const profile = {
    nickname: document.getElementById('p_nick').value.trim(),
    passportNo: document.getElementById('p_pass').value.trim(),
    passportExpiry: document.getElementById('p_passExp').value,
    visaExpiry: document.getElementById('p_visaExp').value,
    startDate: document.getElementById('p_start').value,
    bankName, bankAccount,
  };
  const hasProfile = Object.values(profile).some(v=>v);

  if(state.editingEmp === 'new'){
    const id = 'E' + String(Date.now()).slice(-6);
    state.employees.push({id, branch, name, position, status, resignMonth, baseSalary, allowance, profile: hasProfile?profile:null});
  } else {
    const emp = state.employees.find(e=>e.id===state.editingEmp);
    Object.assign(emp, {branch, name, position, status, resignMonth, baseSalary, allowance});
    emp.profile = hasProfile ? {...(emp.profile||{}), ...profile} : emp.profile;
  }
  await storageSet('employees', state.employees);
  state.editingEmp = null;
  render();
  toast(t('employeeSaved'));
}

async function deleteEmployee(){
  if(!confirm(t('deleteConfirm'))) return;
  state.employees = state.employees.filter(e=>e.id!==state.editingEmp);
  await storageSet('employees', state.employees);
  state.editingEmp = null;
  render();
  toast(t('employeeDeleted'));
}

/* ================= BOOT ================= */
(async function boot(){
  await loadState();
  render();
  if(state.sync.enabled) startSyncPolling();
})();

</script>
